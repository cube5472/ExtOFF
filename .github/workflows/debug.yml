name: ExtOFF
on:
  push:
    branches:
      - dev*
    paths:
      - "app/**"
      - "buildSrc/**"
      - "library/**"
      - ".github/workflows/debug.yml"
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
          cache-dependency-path: "library/core/go.sum"
      - name: Setup Go Mobile
        # https://github.com/golang/mobile/blob/c31d5b91ecc32c0d598b8fe8457d244ca0b4e815/cmd/gomobile/init.go#L83
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30
      - name: Native Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # NextClave: the core ships PREBUILT (committed at
          # app/libs/libexclavecore.aar). CI does not compile the core unless
          # NEXTCLAVE_FORCE_CORE_BUILD=1. bin/lib/core/build.sh enforces the
          # same skip as a second layer.
          ./run lib core
      - name: Core verification (URL-test patch guard)
        run: |
          # The reference-quality URL test lives in the PATCHED binding wrapper
          # (library/core/patched/libexclavecore, wired via replace in
          # library/core/go.mod): two warm GET attempts with keep-alive, the
          # minimum is reported (v2rayNG method). Its distinctive string
          # constant must be present in the shipped libgojni.so. A core built
          # from the pristine wrapper measures a cold single-shot HEAD and
          # inflates readings 3-5x - fail the build instead of shipping it.
          echo "-- AAR md5:"
          md5sum app/libs/libexclavecore.aar
          unzip -p app/libs/libexclavecore.aar libs/arm64-v8a/libgojni.so > /tmp/libgojni.so
          echo "-- libgojni.so (arm64-v8a) md5:"
          md5sum /tmp/libgojni.so
          if grep -aq "invalid status: %s" /tmp/libgojni.so; then
            echo ">> OK: patched UrlTest (v2rayNG method) is inside the core"
          else
            echo ">> FAIL: patched UrlTest NOT found in libgojni.so;"
            echo ">> the core was built from the pristine wrapper and URL-test"
            echo ">> readings will be inflated 3-5x. Restore the replace"
            echo ">> directive in library/core/go.mod and rebuild."
            exit 1
          fi
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: app/libs/libexclavecore.aar
          name: "LibExclaveCore"
      - name: Gradle Cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-debug-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew :app:downloadAssets
          # Build RELEASE variants (R8 + resource shrinking) signed with the
          # committed debug.keystore. Debug variants skip R8, so their
          # unminified dex made every APK roughly 40 MB; the release ones land
          # at ~24 MB, matching upstream releases. Note: release APKs use the
          # plain applicationId (no ".debug" suffix), so they install
          # side-by-side with previously installed debug builds.
          ./gradlew :app:assembleOssRelease :app:assembleLegacyRelease
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: APKs
          path: app/build/outputs/apk/oss/release
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: APKs-legacy
          path: app/build/outputs/apk/legacy/release
