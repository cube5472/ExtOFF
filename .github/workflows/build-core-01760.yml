name: Core rebuild (reference toolchain)

# NextClave job: rebuilds the core from whatever version library/core/go.mod
# currently pins (libexclavecore + exclave-core/v5) using the same toolchain
# as the regular CI builds (Go 1.27.3 + gomobile 19777044 + NDK r30),
# aligned with upstream's toolchain wave (AGP 9.5.0, Java 25).
# library/core/stage_core_patch.sh stages the pinned exclave-core and applies
# the NoDPI disorder + byte-length finalmask + REALITY version patches before
# the build; bin/lib/core/build.sh verifies all patch markers inside the
# produced libgojni.so and fails otherwise.
#
# The fresh AAR replaces the committed one in the WORKSPACE ONLY (git is not
# touched), so the APKs below are built with the new core. The artifact
# LibExclaveCore-rebuild lets you make it permanent later (upload it to
# app/libs/).
#
# Check the "Core Build" step log for:
#   - md5 of the new AAR
#   - md5 of libs/arm64-v8a/libgojni.so INSIDE it (will differ from the old
#     2180d4bb7ad752b166a6d670c7f84834 - that is expected and intended)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
          cache-dependency-path: "library/core/go.sum"
      - name: Setup Go Mobile
        # Same pin as debug.yml / release.yml
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
      - name: Stage patched core (NoDPI disorder + finalmask + realityver)
        run: bash library/core/stage_core_patch.sh
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30
      - name: Core Build (reference toolchain)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./run lib core
          echo "==================== Core verification ===================="
          echo "-- AAR md5:"
          md5sum app/libs/libexclavecore.aar
          echo "-- libgojni.so (arm64-v8a) md5 inside the fresh AAR:"
          unzip -p app/libs/libexclavecore.aar libs/arm64-v8a/libgojni.so | md5sum
          echo "-- AAR contents:"
          unzip -l app/libs/libexclavecore.aar
      - name: Prepare arm64-only AAR artifact
        # gomobile binds all four ABIs (~50-60 MB), which exceeds the 25 MB
        # GitHub web-upload limit. The app's arm64 split is what this project
        # ships (the currently committed AAR is arm64-only too), so the
        # artifact keeps arm64-v8a only and stays web-uploadable. The full
        # AAR is still used by the Gradle step below.
        run: |
          cp -v app/libs/libexclavecore.aar /tmp/LibExclaveCore-arm64.aar
          zip -d /tmp/LibExclaveCore-arm64.aar "libs/armeabi-v7a/*" "libs/x86/*" "libs/x86_64/*"
          md5sum /tmp/LibExclaveCore-arm64.aar
      - name: Upload Core AAR
        uses: actions/upload-artifact@v7
        with:
          name: "LibExclaveCore-rebuild"
          path: /tmp/LibExclaveCore-arm64.aar
      - name: Gradle Cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./gradlew :app:downloadAssets
          ./gradlew :app:assembleOssRelease :app:assembleLegacyRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: APKs-core-rebuild
          path: |
            app/build/outputs/apk/oss/release/*.apk
            app/build/outputs/apk/legacy/release/*.apk
